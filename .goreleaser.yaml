version: 2

project_name: propsy

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/propsy
    binary: propsy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    hooks:
      post:
        - syft "{{ .Path }}" -o spdx-json="dist/{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}.sbom.json"
    # Default ldflags already set "-s -w -X main.version={{.Version}}", which
    # matches cmd/propsy/main.go's `var version` — no override needed here.

archives:
  - formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE.md
      - src: "dist/{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}.sbom.json"
        strip_parent: true

checksum:
  name_template: "checksums.txt"

# Keyless cosign signature (Sigstore) on checksums.txt only: it lists the sha256 of
# every archive, and each archive holds its SBOM, so one signed file covers everything.
# In CI cosign swaps the workflow's GitHub OIDC token for a short-lived certificate
# naming this repo's release workflow, and records the signature in the public Rekor
# transparency log. The bundle is `checksums.txt.sigstore.json`. See README
# "Verifying a release".
signs:
  - id: cosign
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# Same for the container image: cosign signs the multi-arch manifest by digest
# and stores the signature in the registry beside it. (dockers_v2 also attaches
# a buildx SBOM and provenance attestation to the image by default.)
docker_signs:
  - id: cosign
    cmd: cosign
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"
    output: true

# Image digests, for the provenance attestation step in release.yml.
docker_digest:
  name_template: "digests.txt"

# GitHub immutable releases: once published, a release's assets and tag are
# frozen, so everything has to be attached *before* publishing. release-please
# (see .github/workflows/release.yml) therefore creates the release as a
# DRAFT, with its tag already pushed and its generated notes. GoReleaser
# uploads all assets (binaries, checksums, SBOMs, signatures) to that draft,
# then, because `draft` is false, publishes it as the last step. Until that
# moment nothing is sealed, so a failed run can simply be re-run.
changelog:
  disable: true

release:
  # Attach to the draft release-please made rather than creating a release.
  use_existing_draft: true
  draft: false
  # Keep release-please's notes: don't write our own over them.
  mode: keep-existing
  # A re-run after a partial upload replaces assets instead of failing on them.
  replace_existing_artifacts: true
  # Fail before building if this tag is already published as an immutable
  # release (it could never be updated), instead of after.
  preflight:
    fail_on_error: true

# Builds a multi-arch (linux/amd64 + linux/arm64) image per the Dockerfile at
# the repo root, which just COPYs the prebuilt static binary — GoReleaser
# builds the Go binaries itself (see `builds` above), so the Dockerfile must
# not also run `go build`, or you're compiling twice. See
# https://goreleaser.com/customization/package/dockers_v2/
dockers_v2:
  - images:
      - ghcr.io/lalu-uk/propsy
    # Exact version only: no "latest" (or floating "1"/"1.2") tag, since a tag
    # that moves isn't immutable. ghcr can't enforce tag immutability itself, so
    # this is by convention, backed by the cosign signature: verify it, or pin
    # the digest, if you need a guarantee.
    tags:
      - "{{ .Tag }}"
    platforms:
      - linux/amd64
      - linux/arm64
