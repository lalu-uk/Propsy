version: 2

project_name: propsy

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/propsy
    binary: propsy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Default ldflags already set "-s -w -X main.version={{.Version}}", which
    # matches cmd/propsy/main.go's `var version` — no override needed here.

archives:
  - formats: ["binary"]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# GitHub immutable releases: once published, a release's assets and tag are
# frozen, so everything has to be attached *before* publishing. release-please
# (see .github/workflows/release.yml) therefore creates the release as a
# DRAFT, with its tag already pushed and its generated notes. GoReleaser
# uploads all assets (binaries and checksums) to that draft,
# then, because `draft` is false, publishes it as the last step. Until that
# moment nothing is sealed, so a failed run can simply be re-run.
changelog:
  disable: true

release:
  # Attach to the draft release-please made rather than creating a release.
  use_existing_draft: true
  draft: false
  # Keep release-please's notes: don't write our own over them.
  mode: keep-existing
  # A re-run after a partial upload replaces assets instead of failing on them.
  replace_existing_artifacts: true
  # Fail before building if this tag is already published as an immutable
  # release (it could never be updated), instead of after.
  preflight:
    fail_on_error: true

# Builds a multi-arch (linux/amd64 + linux/arm64) image per the Dockerfile at
# the repo root, which just COPYs the prebuilt static binary — GoReleaser
# builds the Go binaries itself (see `builds` above), so the Dockerfile must
# not also run `go build`, or you're compiling twice. See
# https://goreleaser.com/customization/package/dockers_v2/
dockers_v2:
  - images:
      - ghcr.io/lalu-uk/propsy
    tags:
      - "{{ .Tag }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
