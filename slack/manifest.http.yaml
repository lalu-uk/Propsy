# Slack app manifest for Cloud Run (HTTP). Replace https://YOUR-SERVICE.run.app.
# Slack treats Socket Mode and HTTP URLs as mutually exclusive: use a separate app per mode.
# Create the app at https://api.slack.com/apps → "From a manifest", install it → SLACK_BOT_TOKEN (xoxb-);
# Basic Information → Signing Secret → SLACK_SIGNING_SECRET.
display_information:
  name: Propsy
  description: Hey that was cool thx
  background_color: "#2c2d30"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: Propsy
    always_online: false
  slash_commands:
    - command: /propsy
      description: Hey that was cool thx
      usage_hint: "@someone for that thing"
      should_escape: true
      url: https://YOUR-SERVICE.run.app/slack/commands
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write # only used if PROPSY_ANNOUNCE_CHANNEL is set; then /invite the bot to that channel
settings:
  event_subscriptions:
    request_url: https://YOUR-SERVICE.run.app/slack/events
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
    request_url: https://YOUR-SERVICE.run.app/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
