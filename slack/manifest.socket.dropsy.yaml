# Slack app manifest (WITH the optional /dropsy command) for local development over Socket Mode.
# Create the app at https://api.slack.com/apps → "From a manifest", then:
#   - Install to workspace → SLACK_BOT_TOKEN (xoxb-)
#   - Basic Information → App-Level Tokens → scope connections:write → SLACK_APP_TOKEN (xapp-)
display_information:
  name: Propsy
  description: Hey that was cool thx
  background_color: "#2c2d30"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: Propsy
    always_online: false
  slash_commands:
    - command: /propsy
      description: Hey that was cool thx
      usage_hint: "@someone for that thing"
      should_escape: true # required: delivers mentions as <@U123|name>
    # Optional: lets people subtract propsies for the lulz. Only use this manifest
    # if that fits your culture; the default manifest has no /dropsy.
    - command: /dropsy
      description: I didn't like that thing
      usage_hint: "@someone for that thing you did"
      should_escape: true
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write # only used if PROPSY_ANNOUNCE_CHANNEL is set; then /invite the bot to that channel
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
