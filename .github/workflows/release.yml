name: Release

# Fires once CI finishes on main — i.e. after a PR merges — not on every push,
# so a release PR can never be opened/updated, nor a release cut, from a
# commit that hasn't passed go test/lint. PR branches don't match
# `branches: [main]` here (that filters on the completed workflow's branch,
# not any branch it touched), so this stays dormant until something actually
# lands on main — including the release PR's own merge commit, which is what
# actually cuts a release (see release-please's PR-based flow below).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Nothing by default: each job asks only for what it needs.
permissions: {}

jobs:
  release-please:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # open/update the release PR, create the tag + GitHub Release
      issues: write # label and comment on related issues
      pull-requests: write # open/update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Maintains a standing "chore(main): release X.Y.Z" PR summarizing
      # every Conventional Commit merged since the last release (feat: ->
      # minor, fix: -> patch, "!"/"BREAKING CHANGE:" -> major; chore:/docs:/
      # ci:-only changes get no PR at all). Merging that PR is what cuts the
      # release, and this step is a no-op on every other merge.
      #
      # This org uses GitHub immutable releases, where a published release's
      # assets and tag are frozen. So release-please only creates a DRAFT
      # release (config: "draft": true) and pushes its tag right away
      # ("force-tag-creation": without it GitHub withholds the tag until
      # publish, and release-please then can't find the previous release and
      # proposes a bogus next-major release). The goreleaser job below uploads
      # every asset to that draft and publishes it. Config lives in
      # release-please-config.json / .release-please-manifest.json.
      - name: release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the GitHub Release
      packages: write # push the image to ghcr.io
      id-token: write # keyless signing (cosign) and attestations: the job's OIDC token
      attestations: write # store build provenance attestations
      actions: read # verify CI for the tagged commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-please pushed this tag moments ago; checking it out
          # explicitly (rather than the default branch tip) is what gives
          # GoReleaser `{{ .Tag }}`/`{{ .Version }}` to build.
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Verify CI for release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_sha="$(git rev-parse HEAD)"
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${release_sha}&per_page=100")"
            if jq -e --arg sha "$release_sha" '
              any(.workflow_runs[];
                .head_sha == $sha and
                .event == "push" and
                .head_branch == "main" and
                .status == "completed" and
                .conclusion == "success"
              )
            ' <<< "$runs" > /dev/null; then
              echo "CI passed for release commit ${release_sha}"
              exit 0
            fi
            sleep 15
          done
          echo "No successful CI run found for release commit ${release_sha}" >&2
          exit 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # QEMU + a container buildx driver are what let a single amd64 runner
      # assemble the linux/arm64 half of the image too (see .goreleaser.yaml's
      # dockers_v2.platforms). No Go code actually runs emulated — GoReleaser
      # cross-compiles both binaries natively first; buildx is only COPYing
      # the right one into each per-arch image layer.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cosign signs the binaries, checksums, SBOMs and image keylessly, and Syft
      # generates the SBOMs (see `signs`, `sboms` and `docker_signs` in
      # .goreleaser.yaml). Both must be on PATH before GoReleaser runs.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # Cross-compiles binaries for linux/darwin/windows x amd64/arm64 (see
      # `builds` in .goreleaser.yaml), builds checksums, SBOMs and signatures,
      # pushes the linux/amd64+arm64 ghcr.io image, uploads all of that to
      # the DRAFT release release-please created, and finally publishes the
      # draft (`release.use_existing_draft` + `draft: false`), at which point
      # GitHub makes it immutable. If this job fails before that, the draft
      # is still unsealed: fix the cause and re-run the failed job (the
      # release-please outputs are reused, so the job gets the same tag).
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build provenance (SLSA) attestations, stored by GitHub and verifiable
      # with `gh attestation verify`: one covering every file listed in
      # checksums.txt (the binaries), one covering the image digests. These
      # complement the cosign signatures: a signature says who published an
      # artifact, provenance says which workflow run built it from which commit.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/digests.txt
