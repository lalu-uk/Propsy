name: QEMU check (temporary)

on:
  pull_request:
    paths:
      - ".github/workflows/qemu-check.yml"

permissions:
  contents: read

jobs:
  multiarch-without-qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Show that no emulator is registered
        run: |
          echo "binfmt_misc entries:"; ls /proc/sys/fs/binfmt_misc/ 2>&1 || true
          if ls /proc/sys/fs/binfmt_misc/ 2>/dev/null | grep -qi -E 'qemu|aarch64|arm'; then
            echo "an ARM emulator IS registered, so this check proves nothing" >&2; exit 1
          fi
          echo "no ARM emulator registered"

      - name: Fake the prebuilt binaries GoReleaser would provide
        run: |
          mkdir -p linux/amd64 linux/arm64
          printf '#!/bin/sh\n' > linux/amd64/propsy
          printf '#!/bin/sh\n' > linux/arm64/propsy

      - name: Build the multi-arch image (amd64 + arm64) without QEMU
        run: docker buildx build --platform linux/amd64,linux/arm64 --output type=oci,dest=/tmp/image.tar .
